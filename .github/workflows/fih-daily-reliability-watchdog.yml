name: FIH Daily Reliability Watchdog
"on":
  workflow_dispatch:
  schedule:
    - cron: "*/15 4-9 * * *"
permissions:
  contents: write
concurrency:
  group: fih-daily-recovery
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify runner Node
        run: node --version && npm --version
      - run: npm install --no-audit --no-fund
      - name: Inspect durable daily heartbeat
        id: watchdog
        shell: bash
        run: |
          set +e
          npm run reliability:watchdog -- --date "$(TZ=Africa/Johannesburg date +%F)" | tee /tmp/watchdog.json
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Reconcile recoverable durable state
        if: steps.watchdog.outputs.code == '10'
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(TZ=Africa/Johannesburg date +%F)"
          npm run run:ledger:init -- --date "$DATE"
          npm run run:ledger:verify -- --date "$DATE"
          mkdir -p data/recovery-requests
          node - "$DATE" <<'NODE'
          const fs=require("fs");
          const date=process.argv[2];
          const ledger=JSON.parse(fs.readFileSync(`data/run-state/${date}.json`,"utf8"));
          fs.writeFileSync(`data/recovery-requests/${date}.json`,JSON.stringify({
            schema:"fih-recovery-request-v1",date,runId:ledger.runId,
            requestedAt:new Date().toISOString(),reason:"WATCHDOG_RECOVERY",
            next:ledger.next,status:"PENDING_EXECUTOR"
          },null,2)+"\n");
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/run-state/$DATE.json" "data/recovery-requests/$DATE.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "reliability: reclaim daily run $DATE"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
      - name: Assert recovery checkpoint is durable
        if: steps.watchdog.outputs.code == '10'
        run: |
          git fetch origin main
          DATE="$(TZ=Africa/Johannesburg date +%F)"
          git show "origin/main:data/run-state/$DATE.json" >/tmp/persisted-ledger.json
          git show "origin/main:data/recovery-requests/$DATE.json" >/tmp/recovery-request.json
          node -e 'const l=require("/tmp/persisted-ledger.json"),r=require("/tmp/recovery-request.json"); if(!l.runId||!l.heartbeatAt||!["RUNNING","RECOVERING","COMPLETE"].includes(l.runStatus)||r.runId!==l.runId||r.status!=="PENDING_EXECUTOR") process.exit(1); console.log(JSON.stringify({verified:true,runId:l.runId,status:l.runStatus,heartbeatAt:l.heartbeatAt,next:l.next,recoveryRequest:r.status}))'
      - name: Recovery handoff
        if: steps.watchdog.outputs.code == '10'
        run: |
          echo "::notice::Durable run reclaimed. External FIH execution watchdog resumes the full research/model/publication pipeline from ledger.next."