name: FIH Daily Reliability Watchdog
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["automation/recover-now.flag"]
  schedule:
    - cron: "*/15 * * * *"
permissions:
  contents: write
  id-token: write
concurrency:
  group: fih-daily-recovery
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify runner Node
        run: node --version && npm --version
      - run: npm install --no-audit --no-fund
      - name: Resolve recovery date
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(TZ=Africa/Johannesburg date +%F)"
          if [ "${{ github.event_name }}" = "push" ] && [ -s automation/recover-now.flag ]; then
            DATE="$(head -n 1 automation/recover-now.flag | tr -d '[:space:]')"
          fi
          node -e 'const d=process.argv[1];if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(d)||new Date(d+"T00:00:00Z").toISOString().slice(0,10)!==d)process.exit(1)' "$DATE"
          echo "FIH_RECOVERY_DATE=$DATE" >> "$GITHUB_ENV"
      - name: Inspect durable daily heartbeat
        id: watchdog
        shell: bash
        run: |
          set +e
          npm run reliability:watchdog -- --date "$FIH_RECOVERY_DATE" | tee /tmp/watchdog.json
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Reconcile recoverable durable state
        if: steps.watchdog.outputs.code == '10'
        shell: bash
        run: |
          set -euo pipefail
          DATE="$FIH_RECOVERY_DATE"
          npm run run:ledger:init -- --date "$DATE"
          npm run run:ledger:verify -- --date "$DATE"
          mkdir -p data/recovery-requests
          node - "$DATE" <<'NODE'
          const fs=require("fs");
          const date=process.argv[2];
          const ledger=JSON.parse(fs.readFileSync(`data/run-state/${date}.json`,"utf8"));
          fs.writeFileSync(`data/recovery-requests/${date}.json`,JSON.stringify({
            schema:"fih-recovery-request-v1",date,runId:ledger.runId,
            requestedAt:new Date().toISOString(),reason:"WATCHDOG_RECOVERY",
            next:ledger.next,status:"PENDING_EXECUTOR"
          },null,2)+"\\n");
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/run-state/$DATE.json" "data/recovery-requests/$DATE.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "reliability: reclaim daily run $DATE"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
      - name: Assert recovery checkpoint is durable
        if: steps.watchdog.outputs.code == '10'
        run: |
          git fetch origin main
          DATE="$FIH_RECOVERY_DATE"
          git show "origin/main:data/run-state/$DATE.json" >/tmp/persisted-ledger.json
          git show "origin/main:data/recovery-requests/$DATE.json" >/tmp/recovery-request.json
          node -e 'const l=require("/tmp/persisted-ledger.json"),r=require("/tmp/recovery-request.json"); if(!l.runId||!l.heartbeatAt||!["RUNNING","RECOVERING","COMPLETE"].includes(l.runStatus)||r.runId!==l.runId||r.status!=="PENDING_EXECUTOR") process.exit(1); console.log(JSON.stringify({verified:true,runId:l.runId,status:l.runStatus,heartbeatAt:l.heartbeatAt,next:l.next,recoveryRequest:r.status}))'
      - name: Resolve protected FIH production endpoint
        if: steps.watchdog.outputs.code == '10'
        run: |
          BASE="${{ vars.FIH_INGEST_BASE_URL }}"
          if [ -z "$BASE" ]; then
            DOMAIN="$(node -e 'const r=require("./config/fih-execution-rules.json");process.stdout.write(r.infrastructure.vercel.productionDomain)')"
            BASE="https://$DOMAIN"
          fi
          echo "FIH_INGEST_BASE_URL=$BASE" >> "$GITHUB_ENV"
          echo "FIH_RESEARCH_BASE_URL=$BASE" >> "$GITHUB_ENV"
      - name: Mint short-lived GitHub OIDC identity
        if: steps.watchdog.outputs.code == '10'
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('fih-step2')
            core.setSecret(token)
            core.setOutput('token', token)
      - name: Execute recovered Step 2
        if: steps.watchdog.outputs.code == '10'
        env:
          FIH_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node scripts/step2-recovery-runner.mjs --date "$FIH_RECOVERY_DATE"
      - name: Verify recovered Step 2 is persisted
        if: steps.watchdog.outputs.code == '10'
        run: |
          git fetch origin main
          DATE="$FIH_RECOVERY_DATE"
          git show "origin/main:data/run-state/$DATE.json" >/tmp/recovered-ledger.json
          git show "origin/main:data/recovery-requests/$DATE.json" >/tmp/recovered-request.json
          node -e 'const l=require("/tmp/recovered-ledger.json"),r=require("/tmp/recovered-request.json"); if(l.counts?.PENDING!==0||l.counts?.RESEARCH_VERIFIED!==l.counts?.eligible||r.status!=="RECOVERED_STEP2") process.exit(1); console.log(JSON.stringify({verified:true,date:l.date,researchRunId:l.researchRunId,researchVerified:l.counts.RESEARCH_VERIFIED,status:r.status}))'
