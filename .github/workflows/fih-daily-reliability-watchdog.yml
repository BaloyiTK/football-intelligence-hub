name: FIH Daily Reliability Watchdog
"on":
  workflow_dispatch:
  schedule:
    - cron: "*/15 4-9 * * *"
permissions:
  contents: write
concurrency:
  group: fih-daily-recovery
  cancel-in-progress: false
jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: Inspect durable daily heartbeat
        id: watchdog
        shell: bash
        run: |
          set +e
          npm run reliability:watchdog -- --date "$(TZ=Africa/Johannesburg date +%F)" | tee /tmp/watchdog.json
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Reconcile recoverable durable state
        if: steps.watchdog.outputs.code == '10'
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(TZ=Africa/Johannesburg date +%F)"
          npm run run:ledger:init -- --date "$DATE"
          npm run run:ledger:verify -- --date "$DATE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/run-state/$DATE.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "reliability: reclaim daily run $DATE"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
            sleep $((attempt * 2))
          done
          exit 1
      - name: Assert recovery checkpoint is durable
        if: steps.watchdog.outputs.code == '10'
        run: |
          git fetch origin main
          git show "origin/main:data/run-state/$(TZ=Africa/Johannesburg date +%F).json" >/tmp/persisted-ledger.json
          node -e 'const x=require("/tmp/persisted-ledger.json"); if(!x.runId||!x.heartbeatAt||!["RUNNING","RECOVERING","COMPLETE"].includes(x.runStatus)) process.exit(1); console.log(JSON.stringify({verified:true,runId:x.runId,status:x.runStatus,heartbeatAt:x.heartbeatAt,next:x.next}))'
      - name: Recovery handoff
        if: steps.watchdog.outputs.code == '10'
        run: |
          echo "::notice::Durable run reclaimed. External FIH execution watchdog resumes the full research/model/publication pipeline from ledger.next."