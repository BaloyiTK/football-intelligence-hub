name: FIH Soccerway Discovery Probe
"on":
  pull_request:
    branches: [main]
    paths:
      - "scripts/soccerway-discovery-probe.ts"
      - "scripts/soccerway-browser-probe.ts"
      - ".github/workflows/fih-soccerway-discovery-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Install browser probe dependency
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Resolve date
        run: echo "FIH_DATE=$(TZ=Africa/Johannesburg date +%F)" >> "$GITHUB_ENV"
      - name: Probe Soccerway discovery
        run: npx tsx scripts/soccerway-discovery-probe.ts
      - name: Probe rendered Soccerway evidence
        run: npx tsx scripts/soccerway-browser-probe.ts
