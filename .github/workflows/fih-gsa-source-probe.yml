name: FIH GSA Source Probe

"on":
  pull_request:
    branches: [main]
    paths:
      - "scripts/gsa-source-probe.ts"
      - ".github/workflows/fih-gsa-source-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Probe Global Sports Archive discovery
        run: npx tsx scripts/gsa-source-probe.ts
      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: fih-gsa-source-probe
          path: data/research-probe/*-gsa.json
          if-no-files-found: error
          retention-days: 3
