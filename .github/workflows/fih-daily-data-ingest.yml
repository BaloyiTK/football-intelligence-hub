name: FIH Step 1 Persisted Fixture Audit

"on":
  workflow_dispatch:
  schedule:
    - cron: "50 3 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify today's persisted LiveScore snapshot
        run: |
          set -euo pipefail
          DATE="$(TZ=Africa/Johannesburg date +%F)"
          FILE="data/prediction-fixtures/$DATE.json"
          test -s "$FILE"
          node - "$DATE" "$FILE" <<'NODE'
          const fs=require("fs");
          const expected=process.argv[2], file=process.argv[3];
          const x=JSON.parse(fs.readFileSync(file,"utf8"));
          if(x.schema!=="fih-prediction-fixture-v1") throw new Error("invalid schema");
          if(x.mode!=="PREDICTION") throw new Error("invalid mode");
          if(x.date!==expected) throw new Error("expected "+expected+", got "+x.date);
          if(x.timezone!=="Africa/Johannesburg") throw new Error("invalid timezone");
          if(!Array.isArray(x.payload?.Stages)||!x.payload.Stages.length) throw new Error("missing Stages");
          const n=x.payload.Stages.reduce((a,s)=>a+(Array.isArray(s.Events)?s.Events.length:0),0);
          if(!n||n!==x.fixtureCount) throw new Error("invalid fixture count");
          if(Number.isNaN(Date.parse(x.fetchedAt))) throw new Error("invalid fetchedAt");
          console.log(JSON.stringify({step:"STEP1",verified:true,date:x.date,stageCount:x.stageCount,fixtureCount:x.fixtureCount,fetchedAt:x.fetchedAt}));
          NODE
