name: FIH Fresh Data Gate Audit

on:
  workflow_dispatch:
  schedule:
    # 05:50 SAST: audit the Vercel-owned 05:30 ingest before the 06:00 prediction run.
    - cron: "50 3 * * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify today's persisted LiveScore snapshot
        run: |
          set -euo pipefail
          DATE="$(TZ=Africa/Johannesburg date +%F)"
          node -e '
            const fs=require("fs");
            const x=JSON.parse(fs.readFileSync("data/today_fixture.json","utf8"));
            const expected=process.argv[1];
            if(x.schema!=="fih-today-fixture-v1") throw new Error("invalid schema");
            if(x.date!==expected) throw new Error("fresh-data gate failed: expected "+expected+", got "+x.date);
            if(x.timezone!=="Africa/Johannesburg") throw new Error("invalid timezone");
            if(!Array.isArray(x.payload?.Stages)||!x.payload.Stages.length) throw new Error("missing Stages");
            const n=x.payload.Stages.reduce((a,s)=>a+(Array.isArray(s.Events)?s.Events.length:0),0);
            if(!n||n!==x.fixtureCount) throw new Error("invalid fixture count");
            console.log(JSON.stringify({gate:"PASS",date:x.date,stageCount:x.stageCount,fixtureCount:x.fixtureCount,fetchedAt:x.fetchedAt}));
          ' "$DATE"
