name: FIH LiveScore Daily Ingest

on:
  push:
    paths:
      - ".github/workflows/fih-daily-data-ingest.yml"
      - "scripts/ingest-daily-fixtures.ts"
  workflow_dispatch:
    inputs:
      refresh:
        description: Force refresh even if today's rolling fixture file already exists
        required: false
        default: false
        type: boolean
  schedule:
    # 05:30 SAST (UTC+02:00): complete fresh-data gate before the 06:00 SAST daily prediction run.
    - cron: "30 3 * * *"

permissions:
  contents: write

concurrency:
  group: fih-livescore-daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Resolve SAST date
        id: date
        run: echo "date=$(TZ=Africa/Johannesburg date +%F)" >> "$GITHUB_OUTPUT"
      - name: Fetch LiveScore fixtures
        env:
          RAPIDAPI_KEY: ${{ secrets.LS_API_KEY }}
        run: |
          EXTRA=""
          if [ "${{ inputs.refresh }}" = "true" ]; then EXTRA="--refresh"; fi
          npm run fixtures:ingest -- "${{ steps.date.outputs.date }}" $EXTRA
      - name: Commit LiveScore snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/today_fixture.json
          git diff --cached --quiet && exit 0
          git commit -m "data: refresh LiveScore fixtures ${{ steps.date.outputs.date }}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*15))
          done
          exit 1
