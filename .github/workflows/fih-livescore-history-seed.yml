name: FIH LiveScore History Seed

"on":
  push:
    paths:
      - automation/livescore-history.flag

permissions:
  contents: read
  id-token: write

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve target date
        shell: bash
        run: |
          set -euo pipefail
          DATE="$(head -n 1 automation/livescore-history.flag | tr -d '[:space:]')"
          echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          echo "FIH_DATE=$DATE" >> "$GITHUB_ENV"
      - name: Fetch LiveScore history months
        run: node scripts/livescore-history-seed.mjs "$FIH_DATE"
