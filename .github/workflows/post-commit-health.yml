name: Post-Commit Health Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: post-commit-health-main
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund

      - name: Build application
        run: npm run build

      - name: Exercise model training pipeline
        run: npm run model:train:check

      - name: Validate changed FIH artifacts
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="$(git rev-list --max-parents=0 HEAD)"
          fi
          mapfile -t RUNS < <(git diff --name-only "$BASE" HEAD -- 'data/runs/*.json' 'data/backtests/*.json')
          for file in "${RUNS[@]}"; do
            [[ -f "$file" ]] || continue
            npm run run:validate -- "$file"
            if grep -q '"status"[[:space:]]*:[[:space:]]*"complete"' "$file"; then
              npm run run:finalize -- "$file"
            fi
          done
          mapfile -t PREDICTIONS < <(git diff --name-only "$BASE" HEAD -- 'data/predictions/*.json')
          for file in "${PREDICTIONS[@]}"; do
            [[ -f "$file" ]] || continue
            npm run predictions:verify -- "$(basename "$file" .json)"
          done

      - name: Verify exact production deployment when Vercel reports success
        if: github.event_name == 'push'
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          SITE: https://football-intelligence-hub.vercel.app
        run: |
          set -euo pipefail
          status_url="https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${EXPECTED_SHA}/status"
          state=""
          description=""
          target=""
          for attempt in {1..12}; do
            payload="$(curl -fsSL -H "Accept: application/vnd.github+json" "$status_url")"
            state="$(node -e 'const x=JSON.parse(process.argv[1]);const s=x.statuses.find(v=>v.context==="Vercel");console.log(s?.state??"missing")' "$payload")"
            description="$(node -e 'const x=JSON.parse(process.argv[1]);const s=x.statuses.find(v=>v.context==="Vercel");console.log(s?.description??"")' "$payload")"
            target="$(node -e 'const x=JSON.parse(process.argv[1]);const s=x.statuses.find(v=>v.context==="Vercel");console.log(s?.target_url??"")' "$payload")"
            echo "Vercel status: $state — $description"
            if [[ "$state" == "success" ]]; then break; fi
            if [[ "$state" == "failure" || "$state" == "error" ]]; then
              echo "::error::Vercel failed for exact commit $EXPECTED_SHA: $description"
              exit 1
            fi
            sleep 15
          done
          if [[ "$state" != "success" ]]; then
            echo "::error::No successful Vercel deployment status for exact commit $EXPECTED_SHA."
            exit 1
          fi
          latest="$(find data/predictions -maxdepth 1 -type f -name '????-??-??.json' -printf '%f\n' | sed 's/.json$//' | sort -r | head -1)"
          dated="$(curl -fsSL --retry 2 --retry-delay 3 --max-time 20 "$SITE/?date=$latest")"
          grep -q "$latest" <<<"$dated"
          ! grep -q "No published slate" <<<"$dated"
          echo "Exact commit received a successful Vercel status and production serves archive $latest."
