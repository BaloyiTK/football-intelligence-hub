name: FIH LiveScore Step 2 Probe

"on":
  push:
    paths:
      - automation/livescore-probe.flag

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve probe
        shell: bash
        run: |
          set -euo pipefail
          EID="$(head -n 1 automation/livescore-probe.flag | tr -d '[:space:]')"
          echo "$EID" | grep -Eq '^[0-9]+$'
          echo "FIH_EID=$EID" >> "$GITHUB_ENV"
      - name: Probe LiveScore Step 2 data
        env:
          LS_API_KEY_LOWER: ${{ secrets.ls_api_key }}
          LS_API_KEY_UPPER: ${{ secrets.LS_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: node scripts/livescore-direct-probe.mjs "$FIH_EID"
