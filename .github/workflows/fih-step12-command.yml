name: FIH Steps 1-2 Command
on:
  push:
    branches: [main]
    paths: ["automation/run-now.flag"]
  workflow_dispatch:
    inputs:
      command:
        description: "FIH command, e.g. run today, run yesterday, run past 3 days, run from YYYY-MM-DD to YYYY-MM-DD"
        required: true
        default: "run today"
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: fih-step12-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  step12:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Resolve FIH command
        run: |
          CMD="${{ github.event.inputs.command || '' }}"
          if [ -z "$CMD" ]; then
            CMD="$(head -n 1 automation/run-now.flag | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          fi
          test -n "$CMD"
          echo "FIH_COMMAND=$CMD" >> "$GITHUB_ENV"
      - name: Resolve protected FIH production endpoint
        run: |
          BASE="${{ vars.FIH_INGEST_BASE_URL }}"
          if [ -z "$BASE" ]; then
            DOMAIN="$(node -e 'const r=require("./config/fih-execution-rules.json");process.stdout.write(r.infrastructure.vercel.productionDomain)')"
            BASE="https://$DOMAIN"
          fi
          echo "FIH_INGEST_BASE_URL=$BASE" >> "$GITHUB_ENV"
      - name: Mint short-lived GitHub OIDC identity
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('fih-step2')
            core.setSecret(token)
            core.setOutput('token', token)
      - name: Execute Step 1 and prepare ChatGPT Step 2 queue
        env:
          FIH_TRUSTED_OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: node scripts/step12-command-runner.mjs "$FIH_COMMAND"
      - name: Verify durable ChatGPT Step 2 handoff
        run: |
          set -euo pipefail
          git fetch origin main
          node --input-type=module - "$FIH_COMMAND" <<'NODE'
          import {execFileSync} from "node:child_process";
          import {resolveCommand} from "./scripts/fih-command-router.mjs";
          const plan=resolveCommand(process.argv[2]);
          const show=(p)=>JSON.parse(execFileSync("git",["show","origin/main:"+p],{encoding:"utf8"}));
          for(const {date} of plan.dates){
            const q=show("data/research-queue/"+date+".json");
            const l=show("data/run-state/"+date+".json");
            const h=show("data/recovery-requests/"+date+".json");
            if(q.executor!=="CHATGPT_WEB_SEARCH"||!q.researchRunId||q.researchRunId!==l.researchRunId||h.researchRunId!==q.researchRunId||h.runId!==l.runId||h.status!=="CHATGPT_RESEARCH_REQUIRED"||h.expectedFixtureCount!==q.count||q.count!==l.counts?.eligible||l.counts?.PENDING!==l.counts?.eligible)throw new Error("CHATGPT_HANDOFF_PERSISTENCE_INVALID "+date);
            console.log(JSON.stringify({verified:true,date,researchRunId:q.researchRunId,eligible:q.count,handoff:h.status}));
          }
          NODE
      - name: Assert no Step 3 execution
        run: |
          echo "GitHub workflow boundary: Step 1 verified and durable Step 2 handoff persisted. Active ChatGPT must consume the queue immediately; no hosted AI research is allowed."
