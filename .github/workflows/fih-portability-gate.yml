name: FIH Portability and Step 1-2 Contract Gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Enforce fail-closed readiness checks
        run: |
          node scripts/test-fih-command-router.mjs
          node scripts/verify-portable-contract.mjs
