name: Publish FIH Daily Artifact

on:
  workflow_dispatch:
    inputs:
      run_file:
        description: "Strict-finalized run file under data/runs/"
        required: true
        type: string

concurrency:
  group: fih-daily-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate input
        id: input
        shell: bash
        run: |
          set -euo pipefail
          RUN_FILE="${{ inputs.run_file }}"
          [[ "$RUN_FILE" == data/runs/* && "$RUN_FILE" != *".."* && -f "$RUN_FILE" ]] || { echo "::error::Invalid run_file"; exit 1; }
          DATE="$(node -p 'require("./"+process.argv[1]).date' "$RUN_FILE")"
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::Invalid run date"; exit 1; }
          echo "run_file=$RUN_FILE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          for delay in 0 15 45; do
            (( delay > 0 )) && sleep "$delay"
            npm install --no-audit --no-fund && exit 0
          done
          exit 1
      - name: Verify and publish
        run: |
          npm test
          npm run model:preflight
          npm run run:finalize -- "${{ steps.input.outputs.run_file }}"
          npm run predictions:publish-from-run -- "${{ steps.input.outputs.run_file }}"
          npm run predictions:verify -- "${{ steps.input.outputs.date }}"
          npm run build
      - name: Commit and push publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILE="data/predictions/${{ steps.input.outputs.date }}.json"
          git add "$FILE"
          git diff --cached --quiet && exit 0
          git commit -m "predictions: publish ${{ steps.input.outputs.date }}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*15))
          done
          exit 1
