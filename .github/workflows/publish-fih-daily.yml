name: Publish FIH Daily Artifact

on:
  push:
    branches: [main]
    paths:
      - "automation/publish-requests/*.json"

concurrency:
  group: fih-daily-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Resolve publication request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          FILE="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'automation/publish-requests/*.json' | tail -1)"
          [[ -n "$FILE" && -f "$FILE" ]] || { echo "::error::No publication request found"; exit 1; }
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(x.date)) throw new Error("Invalid date"); if(typeof x.runFile!=="string"||!x.runFile.startsWith("data/runs/")||x.runFile.includes("..")) throw new Error("Invalid runFile");' "$FILE"
          echo "date=$(node -p 'require("./"+process.argv[1]).date' "$FILE")" >> "$GITHUB_OUTPUT"
          echo "run_file=$(node -p 'require("./"+process.argv[1]).runFile' "$FILE")" >> "$GITHUB_OUTPUT"
      - name: Verify contract and finalized run
        run: |
          npm test
          npm run model:preflight
          npm run run:finalize -- "${{ steps.request.outputs.run_file }}"
      - name: Build dated prediction artifact from frozen BET records
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const runFile=process.env.RUN_FILE;
          const date=process.env.DATE;
          const run=JSON.parse(fs.readFileSync(runFile,"utf8"));
          const fixtures=(run.fixtures||[]).filter(x=>x.status==="BET"&&x.recommendedBet?.publishable===true).map(x=>({
            date:x.date||date,
            fixtureKey:x.fixtureKey,
            leagueId:x.leagueId,
            league:x.league||x.leagueName||x.leagueId,
            homeTeam:x.homeTeam,
            awayTeam:x.awayTeam,
            kickoff:x.kickoff||x.kickoffLocal||x.kickoffAt||"TBD",
            status:"Predicted",
            model:x.model,
            sources:x.sources,
            researchedAt:x.researchedAt,
            recommendedBet:x.recommendedBet
          }));
          const out={date,timezone:run.timezone||"Africa/Johannesburg",generatedAt:new Date().toISOString(),fixtures,scan:{status:"complete",leagueEntriesChecked:(run.leagues||[]).filter(x=>x.status==="complete").length,totalLeagueEntries:(run.leagues||[]).length,fixturesDiscovered:(run.fixtures||[]).length,fixturesProcessed:(run.fixtures||[]).filter(x=>["BET","NO_BET","NO_MODEL"].includes(x.status)).length,recommendedBets:fixtures.length,modelVersion:"v2.9-market-specific-quality-selector",sourceRun:run.runId}};
          fs.mkdirSync("data/predictions",{recursive:true});
          fs.writeFileSync("data/predictions/"+date+".json",JSON.stringify(out,null,2)+"\n");
          NODE
        env:
          RUN_FILE: ${{ steps.request.outputs.run_file }}
          DATE: ${{ steps.request.outputs.date }}
      - name: Verify publication artifact
        run: npm run predictions:verify -- "${{ steps.request.outputs.date }}"
      - name: Commit and push publication
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/predictions/${{ steps.request.outputs.date }}.json"
          if git diff --cached --quiet; then
            echo "Artifact already current"
            exit 0
          fi
          git commit -m "predictions: publish ${{ steps.request.outputs.date }}"
          for delay in 0 15 45; do
            [[ "$delay" -gt 0 ]] && sleep "$delay"
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            echo "::warning::push failed; retrying"
          done
          exit 1
