name: FIH ChatGPT Research Refresh
on:
  push:
    branches: [main]
    paths: ["automation/research-refresh.flag"]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Resolve active refresh generation
        run: |
          set -euo pipefail
          FIH_DATE="$(sed -n '1p' automation/research-refresh.flag | tr -d '[:space:]')"
          MARKER_RID="$(sed -n '2p' automation/research-refresh.flag | tr -d '[:space:]')"
          MARKER_STATE="$(sed -n '3p' automation/research-refresh.flag | tr -d '[:space:]')"
          echo "$FIH_DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          test "$MARKER_STATE" = "CHATGPT_SEARCH_COMPLETE"
          LEDGER_RID="$(node -e 'const fs=require("fs"),d=process.argv[1],x=JSON.parse(fs.readFileSync("data/run-state/"+d+".json","utf8"));process.stdout.write(String(x.researchRunId||""))' "$FIH_DATE")"
          test -n "$LEDGER_RID"
          test "$LEDGER_RID" = "$MARKER_RID"
          echo "FIH_DATE=$FIH_DATE" >> "$GITHUB_ENV"
          echo "FIH_RESEARCH_RUN_ID=$LEDGER_RID" >> "$GITHUB_ENV"
      - name: Build and verify single temporary accumulator
        run: |
          set -euo pipefail
          npx tsx scripts/chatgpt-research-refresh.ts --date "$FIH_DATE"
          test -f "data/research-work/$FIH_DATE.json"
          test -f "data/research/$FIH_DATE.json"
          node -e 'const fs=require("fs"),d=process.env.FIH_DATE,r=process.env.FIH_RESEARCH_RUN_ID,a=JSON.parse(fs.readFileSync("data/research-work/"+d+".json","utf8"));if(a.researchRunId!==r||a.validatedFixtureIds.length!==a.expectedCount)throw new Error("TEMP_ACCUMULATOR_NOT_N_OF_N");console.log("TEMP_ACCUMULATOR_VERIFIED",a.validatedFixtureIds.length,a.expectedCount)'
      - name: Commit canonical research exactly once
        run: |
          set -euo pipefail
          git config user.name "fih-runner"
          git config user.email "actions@users.noreply.github.com"
          git add -- "data/research/$FIH_DATE.json"
          git reset -- "data/research-work" 2>/dev/null || true
          if git diff --cached --name-only | grep -q "^data/research-work/"; then echo "FORBIDDEN_RESEARCH_WORK_COMMIT"; exit 1; fi
          STAGED="$(git diff --cached --name-only)"
          test "$STAGED" = "data/research/$FIH_DATE.json"
          git commit -m "research: canonical $FIH_DATE $FIH_RESEARCH_RUN_ID"
          git push
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
      - name: Verify Step 2 lineage
        run: npm run step3:gate -- --date "$FIH_DATE"
      - name: Continue full prediction cycle
        run: npm run run:daily -- --date "$FIH_DATE"
      - name: Persist downstream canonical artifacts
        run: |
          set -euo pipefail
          git config user.name "fih-runner"
          git config user.email "actions@users.noreply.github.com"
          git add -A -- data
          git reset -- "data/research-work" 2>/dev/null || true
          if git diff --cached --name-only | grep -q "^data/research-work/"; then echo "FORBIDDEN_RESEARCH_WORK_COMMIT"; exit 1; fi
          git diff --cached --quiet || git commit -m "prediction: persist $FIH_DATE refreshed canonical cycle artifacts"
          git push
      - name: Enforce complete contract
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          npm run run:ledger:verify -- --date "$FIH_DATE"
          export FIH_VERIFIED_COMMIT_SHA="$(git rev-parse origin/main)"
          npm run contract:gate -- --verdict COMPLETE --date "$FIH_DATE" --rules TERM-002,DAILY-001,DAILY-002,PROG-001,EVID-001 --evidence aggregate-verified,canonical-artifacts-verified,commit-verified
