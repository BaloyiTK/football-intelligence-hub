name: Resume Football Backtests

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: football-backtest-resume
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Resume blocked or in-progress backtests
        run: npm run backtest:resume
      - name: Persist checkpoints
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/backtests; then
            echo "No checkpoint changes."
            exit 0
          fi
          git config user.name "football-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtests
          git commit -m "Resume blocked football backtests"
          git push
