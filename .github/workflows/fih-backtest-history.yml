name: FIH Backtest History
on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Optional comma-separated historical dates (YYYY-MM-DD)"
        required: false
        default: ""
      days:
        description: "Dynamic trailing-day count when dates is empty"
        required: false
        default: "7"
  push:
    paths:
      - 'automation/backtest-run.flag'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Resolve requested dates
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DATES="$(printf '%s' "${{ inputs.dates }}" | tr -d '[:space:]')"
            DAYS="${{ inputs.days }}"
            if [ -z "$DATES" ]; then
              test "$DAYS" -ge 1
              TODAY="$(TZ=Africa/Johannesburg date +%F)"
              DATES="$(for ((i=DAYS;i>=1;i--)); do TZ=Africa/Johannesburg date -d "$TODAY - $i day" +%F; done | paste -sd, -)"
            fi
          else
            DATES="$(tr -d '[:space:]' < automation/backtest-run.flag)"
          fi
          test -n "$DATES"
          echo "BACKTEST_DATES=$DATES" >> "$GITHUB_ENV"
      - name: Process requested dates one by one
        run: |
          BASE="https://football-intelligence-hub-654j.vercel.app/api/backtest-ingest"
          IFS=',' read -ra DS <<< "$BACKTEST_DATES"
          for D in "${DS[@]}"; do
            echo "=== Processing $D ==="
            FIX="data/backtest/fixtures/$D.json"
            if [ ! -s "$FIX" ]; then
              curl --fail --show-error --silent --retry 3 "$BASE?date=$D"
              git fetch origin main
              git reset --hard origin/main
            fi
            test -s "$FIX"
            node -e 'const fs=require("fs");const p=process.argv[1],d=process.argv[2],j=JSON.parse(fs.readFileSync(p));if(j.date!==d||j.mode!=="BACKTEST"||!j.fixtureCount)process.exit(2);console.log(d,j.fixtureCount)' "$FIX" "$D"
            RESEARCH="data/backtest/research/$D.json"
            if [ ! -s "$RESEARCH" ]; then
              echo "RESEARCH_REQUIRED $D: canonical Step 2 artifact absent; refusing synthetic completion"
              exit 4
            fi
            npx tsx scripts/validate-backtest-research.ts --date="$D"
            echo "STEP2_VERIFIED $D; compliant Step 3/4/5 executor not yet wired, refusing false DAY_COMPLETE"
            exit 5
          done
      - name: Persist fixtures and backtest results
        run: |
          git config user.name "fih-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest
          git diff --cached --quiet || git commit -m "backtest: run $BACKTEST_DATES"
          git pull --rebase origin main
          git push origin HEAD:main
