name: FIH Backtest History Steps 1-2
on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Optional comma-separated historical dates (YYYY-MM-DD)"
        required: false
        default: ""
      days:
        description: "Dynamic trailing-day count when dates is empty"
        required: false
        default: "7"
  push:
    paths:
      - "automation/backtest-run.flag"
permissions:
  contents: write
  id-token: write
concurrency:
  group: fih-step12-${{ github.ref }}
  cancel-in-progress: false
jobs:
  backtest-step12:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Resolve protected FIH endpoint
        run: |
          BASE="${{ vars.FIH_INGEST_BASE_URL }}"
          if [ -z "$BASE" ]; then
            DOMAIN="$(node -e 'const r=require("./config/fih-execution-rules.json");process.stdout.write(r.infrastructure.vercel.productionDomain)')"
            BASE="https://$DOMAIN"
          fi
          echo "FIH_INGEST_BASE_URL=$BASE" >> "$GITHUB_ENV"
          echo "FIH_RESEARCH_BASE_URL=$BASE" >> "$GITHUB_ENV"
      - name: Resolve requested historical dates
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DATES="$(printf '%s' "${{ inputs.dates }}" | tr -d '[:space:]')"
            DAYS="${{ inputs.days }}"
            if [ -z "$DATES" ]; then
              echo "$DAYS" | grep -Eq '^[0-9]+$'
              test "$DAYS" -ge 1
              TODAY="$(TZ=Africa/Johannesburg date +%F)"
              DATES="$(for ((i=DAYS;i>=1;i--)); do TZ=Africa/Johannesburg date -d "$TODAY - $i day" +%F; done | paste -sd, -)"
            fi
          else
            DATES="$(tr -d '[:space:]' < automation/backtest-run.flag)"
          fi
          test -n "$DATES"
          TODAY="$(TZ=Africa/Johannesburg date +%F)"
          IFS=',' read -ra DS <<< "$DATES"
          for D in "${DS[@]}"; do
            echo "$D" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
            test "$D" < "$TODAY" || { echo "BACKTEST_DATE_MUST_BE_PAST $D"; exit 1; }
          done
          echo "BACKTEST_DATES=$DATES" >> "$GITHUB_ENV"
      - name: Execute each historical date through Step 1 and Step 2
        run: |
          set -euo pipefail
          IFS=',' read -ra DS <<< "$BACKTEST_DATES"
          for D in "${DS[@]}"; do
            echo "=== FIH Step 1-2 BACKTEST $D ==="
            node scripts/step12-command-runner.mjs "run $D"
          done
      - name: Assert Step 3 was not entered
        run: echo "Historical acceptance workflow stops after verified Step 2 by design."
