name: FIH Backtest History
on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Comma-separated historical dates (YYYY-MM-DD)"
        required: false
        default: "2026-10-04,2026-10-05,2026-10-06"
  push:
    paths:
      - 'automation/backtest-run.flag'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Resolve requested dates
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DATES="${{ inputs.dates }}"
          else
            DATES="$(tr -d '[:space:]' < automation/backtest-run.flag)"
          fi
          test -n "$DATES"
          echo "BACKTEST_DATES=$DATES" >> "$GITHUB_ENV"
      - name: Request dated fixture boards from Vercel
        env:
          FIH_INGEST_URL: ${{ vars.FIH_INGEST_URL }}
        run: |
          BASE="${FIH_INGEST_URL:-https://football-intelligence-hub.vercel.app/api/backtest-ingest}"
          IFS=',' read -ra DS <<< "$BACKTEST_DATES"
          for D in "${DS[@]}"; do
            echo "Requesting Vercel ingestion for $D"
            curl --fail --show-error --silent --retry 3 "$BASE?date=$D"
          done
      - name: Refresh repository after Vercel commits
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Verify committed dated fixture boards
        run: |
          IFS=',' read -ra DS <<< "$BACKTEST_DATES"
          for D in "${DS[@]}"; do
            FILE="data/backtest/fixtures/$D.json"
            test -s "$FILE"
            node -e 'const fs=require("fs");const p=process.argv[1],d=process.argv[2],j=JSON.parse(fs.readFileSync(p));if(j.date!==d||j.mode!=="BACKTEST"||!j.fixtureCount)process.exit(2);console.log(d,j.fixtureCount)' "$FILE" "$D"
          done
      - name: Run leak-free requested-date backtest
        run: npx tsx scripts/run-seven-day-backtest.ts --dates="$BACKTEST_DATES"
      - name: Persist fixtures and backtest results
        run: |
          git config user.name "fih-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest
          git diff --cached --quiet || git commit -m "backtest: run $BACKTEST_DATES"
          git pull --rebase origin main
          git push origin HEAD:main
