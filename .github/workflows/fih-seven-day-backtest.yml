name: FIH Seven Day Backtest
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/run-seven-day-backtest.ts'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx scripts/run-seven-day-backtest.ts
      - run: |
          git config user.name "fih-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backtest/predictions
          git commit -m "backtest: persist seven-day model outputs" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
