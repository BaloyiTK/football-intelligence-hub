name: FIH Run Now - Step 1 + ChatGPT Queue
on:
  workflow_dispatch:
    inputs:
      date:
        description: "Prediction date YYYY-MM-DD"
        required: true
        type: string
permissions:
  contents: write
  id-token: write
concurrency:
  group: fih-step1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Resolve date and Step 1 endpoint
        run: |
          set -euo pipefail
          DATE="${{ github.event.inputs.date }}"
          echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          BASE="${{ vars.FIH_INGEST_BASE_URL }}"
          if [ -z "$BASE" ]; then
            DOMAIN="$(node -e 'const r=require("./config/fih-execution-rules.json");process.stdout.write(r.infrastructure.vercel.productionDomain)')"
            BASE="https://$DOMAIN"
          fi
          echo "FIH_DATE=$DATE" >> "$GITHUB_ENV"
          echo "FIH_INGEST_BASE_URL=$BASE" >> "$GITHUB_ENV"
      - name: Mint Step 1 GitHub OIDC identity
        id: fih_oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('fih-step2')
            core.setSecret(token)
            core.setOutput('token', token)
      - name: Fetch fixtures, verify GitHub persistence, freeze ChatGPT queue
        env:
          FIH_TRUSTED_OIDC_TOKEN: ${{ steps.fih_oidc.outputs.token }}
        run: node scripts/step12-command-runner.mjs "run $FIH_DATE"
      - name: Verify ChatGPT handoff
        run: |
          git fetch origin main
          git show "origin/main:data/research-queue/$FIH_DATE.json" >/tmp/research-queue.json
          git show "origin/main:data/run-state/$FIH_DATE.json" >/tmp/run-state.json
          git show "origin/main:data/recovery-requests/$FIH_DATE.json" >/tmp/recovery-request.json
          node -e 'const q=require("/tmp/research-queue.json"),l=require("/tmp/run-state.json"),h=require("/tmp/recovery-request.json");if(q.executor!=="CHATGPT_WEB_SEARCH"||!q.researchRunId||q.researchRunId!==l.researchRunId||h.researchRunId!==q.researchRunId||h.runId!==l.runId||h.status!=="CHATGPT_RESEARCH_REQUIRED"||h.expectedFixtureCount!==q.count||q.count!==l.counts?.eligible||l.counts?.PENDING!==l.counts?.eligible)process.exit(1);console.log(JSON.stringify({verified:true,date:q.date,researchRunId:q.researchRunId,eligible:q.count,handoff:"CHATGPT_STEP2_REQUIRED",durableStatus:h.status}))'
