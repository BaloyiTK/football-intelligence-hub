name: FIH Run Now
on:
  push:
    branches: [main]
    paths: ["automation/run-now.flag"]
  workflow_dispatch:
    inputs:
      date:
        description: "Prediction date YYYY-MM-DD"
        required: true
        type: string
permissions:
  contents: write
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install --no-audit --no-fund
      - name: Resolve requested prediction date
        run: |
          DATE="${{ github.event.inputs.date || '' }}"
          if [ -z "$DATE" ]; then DATE="$(head -n 1 automation/run-now.flag | tr -d '[:space:]')"; fi
          echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          echo "FIH_DATE=$DATE" >> "$GITHUB_ENV"
      - name: Acquire fresh fixture board
        run: |
          curl --fail --show-error --silent --retry 3 "https://football-intelligence-hub-654j.vercel.app/api/backtest-ingest?date=$FIH_DATE"
          git fetch origin main
          git reset --hard origin/main
          node -e 'const fs=require("fs");const d=process.env.FIH_DATE,p="data/prediction-fixtures/"+d+".json";if(!fs.existsSync(p))throw new Error("FRESH_FIXTURE_BOARD_NOT_PERSISTED "+p);const b=JSON.parse(fs.readFileSync(p,"utf8"));if(b.date!==d||b.mode!=="PREDICTION"||!b.fixtureCount)throw new Error("FRESH_FIXTURE_BOARD_INVALID "+p);console.log("FIXTURE_BOARD_VERIFIED",d,b.fixtureCount)'
      - name: Execute repository-owned prediction cycle
        run: npm run run:daily -- --date "$FIH_DATE"
      - name: Persist generated artifacts
        if: always()
        run: |
          git config user.name "fih-runner"
          git config user.email "actions@users.noreply.github.com"
          git add data/prediction-fixtures data/run-state data/research-queue data/research data/model data/decisions data/predictions
          git reset -- "data/research-work" 2>/dev/null || true
          if git diff --cached --name-only | grep -q "^data/research-work/"; then echo "FORBIDDEN_RESEARCH_WORK_COMMIT"; exit 1; fi
          git diff --cached --quiet || git commit -m "prediction: persist $FIH_DATE canonical cycle artifacts"
          git push
      - name: Enforce DAILY_CYCLE_COMPLETE contract
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          npm run run:ledger:verify -- --date "$FIH_DATE"
          export FIH_VERIFIED_COMMIT_SHA="$(git rev-parse origin/main)"
          npm run contract:gate -- --verdict COMPLETE --date "$FIH_DATE" --rules TERM-002,DAILY-001,DAILY-002,PROG-001,EVID-001 --evidence aggregate-verified,canonical-artifacts-verified,commit-verified
