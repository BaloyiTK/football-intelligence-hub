name: FIH Run Now - Step 1
"on":
  workflow_dispatch:
    inputs:
      date:
        description: "Fixture date YYYY-MM-DD"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: fih-step1-manual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  step1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Resolve date and Step 1 endpoint
        run: |
          set -euo pipefail
          DATE="${{ github.event.inputs.date }}"
          echo "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          BASE="${{ vars.FIH_INGEST_BASE_URL }}"
          if [ -z "$BASE" ]; then
            DOMAIN="$(node -e 'const r=require("./config/fih-execution-rules.json");process.stdout.write(r.infrastructure.vercel.productionDomain)')"
            BASE="https://$DOMAIN"
          fi
          echo "FIH_DATE=$DATE" >> "$GITHUB_ENV"
          echo "FIH_INGEST_BASE_URL=$BASE" >> "$GITHUB_ENV"
      - name: Execute and verify Step 1
        run: node scripts/step1-command-runner.mjs "run $FIH_DATE"
