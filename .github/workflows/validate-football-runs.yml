name: Validate Football Runs

on:
  pull_request:
    paths:
      - "data/runs/**/*.json"
      - "data/backtests/**/*.json"
      - "data/predictions/**/*.json"
      - "scripts/validate-run.ts"
      - "scripts/verify-predictions.ts"
      - "automation/*.md"
      - "lib/model.ts"
      - "lib/grading.ts"
      - "data/leagues.json"
  push:
    branches: [main]
    paths:
      - "data/runs/**/*.json"
      - "data/backtests/**/*.json"
      - "data/predictions/**/*.json"
      - "scripts/validate-run.ts"
      - "scripts/verify-predictions.ts"
      - "automation/*.md"
      - "lib/model.ts"
      - "lib/grading.ts"
      - "data/leagues.json"

jobs:
  validate-runs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Validate changed artifacts
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [[ "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              BASE="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          mapfile -t RUNS < <(git diff --name-only "$BASE" HEAD -- 'data/runs/*.json' 'data/backtests/*.json')
          for file in "${RUNS[@]}"; do
            [[ -f "$file" ]] || continue
            echo "Validating $file"
            npm run run:validate -- "$file"
            if grep -q '"status"[[:space:]]*:[[:space:]]*"complete"' "$file"; then
              npm run run:finalize -- "$file"
            fi
          done

          mapfile -t PREDICTIONS < <(git diff --name-only "$BASE" HEAD -- 'data/predictions/*.json')
          for file in "${PREDICTIONS[@]}"; do
            [[ -f "$file" ]] || continue
            date="$(basename "$file" .json)"
            echo "Verifying published predictions for $date"
            npm run predictions:verify -- "$date"
          done

          if (( ${#RUNS[@]} == 0 && ${#PREDICTIONS[@]} == 0 )); then
            echo "No changed run/backtest/prediction artifacts."
          fi
