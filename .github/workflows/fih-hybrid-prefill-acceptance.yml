name: FIH Hybrid Prefill Acceptance

"on":
  pull_request:
    branches: [main]
    paths:
      - "scripts/hybrid-research-prefill.ts"
      - "scripts/sofascore-prefill-augment.ts"
      - "scripts/research-prefill-import.ts"
      - "scripts/step12-command-runner.mjs"
      - ".github/workflows/fih-hybrid-prefill-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Resolve current SAST date
        run: |
          echo "FIH_DATE=$(TZ=Africa/Johannesburg date +%F)" >> "$GITHUB_ENV"
      - name: Run deterministic prediction prefill sample
        run: npx tsx scripts/hybrid-research-prefill.ts --date "$FIH_DATE"
      - name: Augment deterministic prefill with SofaScore when available
        run: npx tsx scripts/sofascore-prefill-augment.ts --date "$FIH_DATE" || echo "SofaScore unavailable; ESPN prefill remains authoritative fallback"
      - name: Verify prefill and gap artifacts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const d=process.env.FIH_DATE;
          const p=JSON.parse(fs.readFileSync("data/research-prefill/"+d+".json","utf8"));
          const g=JSON.parse(fs.readFileSync("data/research-gap-queue/"+d+".json","utf8"));
          if(p.schema!=="fih-hybrid-research-prefill-v1"||g.schema!=="fih-chatgpt-gap-queue-v1"||p.researchRunId!==g.researchRunId||p.fixtureCount<1)throw new Error("HYBRID_ACCEPTANCE_IDENTITY_INVALID");
          if((p.summary?.matched||0)<1)throw new Error("HYBRID_ACCEPTANCE_NO_MATCHED_FIXTURES");
          console.log(JSON.stringify({accepted:true,summary:p.summary,gaps:g.count},null,2));
          NODE
