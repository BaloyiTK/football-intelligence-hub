name: FIH Hybrid Prefill Acceptance

"on":
  pull_request:
    branches: [main]
    paths:
      - "scripts/hybrid-research-prefill.ts"
      - "scripts/fotmob-prefill-augment.ts"
      - "scripts/research-prefill-import.ts"
      - "scripts/step12-command-runner.mjs"
      - ".github/workflows/fih-hybrid-prefill-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run Step 1-2 architecture tests
        run: npm run step12:test
      - name: Resolve current SAST date
        run: |
          echo "FIH_DATE=$(TZ=Africa/Johannesburg date +%F)" >> "$GITHUB_ENV"
      - name: Run deterministic prediction prefill sample
        run: npx tsx scripts/hybrid-research-prefill.ts --date "$FIH_DATE"
      - name: Snapshot ESPN baseline
        run: cp "data/research-prefill/$FIH_DATE.json" /tmp/fih-prefill-before-fotmob.json
      - name: Augment deterministic prefill with FotMob
        run: npx tsx scripts/fotmob-prefill-augment.ts --date "$FIH_DATE"
      - name: Verify prefill and gap artifacts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const d=process.env.FIH_DATE;
          const p=JSON.parse(fs.readFileSync("data/research-prefill/"+d+".json","utf8"));
          const g=JSON.parse(fs.readFileSync("data/research-gap-queue/"+d+".json","utf8"));
          const before=JSON.parse(fs.readFileSync("/tmp/fih-prefill-before-fotmob.json","utf8"));
          if(p.schema!=="fih-hybrid-research-prefill-v1"||g.schema!=="fih-chatgpt-gap-queue-v1"||p.researchRunId!==g.researchRunId||p.fixtureCount<1)throw new Error("HYBRID_ACCEPTANCE_IDENTITY_INVALID");
          if((p.summary?.matched||0)<1)throw new Error("HYBRID_ACCEPTANCE_NO_MATCHED_FIXTURES");
          if((p.summary?.fotmob?.matched||0)<1)throw new Error("FOTMOB_ACCEPTANCE_NO_MATCHED_FIXTURES");
          if((p.summary?.fullyValidatedFixtures||0)<(before.summary?.fullyValidatedFixtures||0))throw new Error("FOTMOB_ACCEPTANCE_VALIDATED_REGRESSION");
          if(g.count>(before.summary?.gapFixtures??before.fixtureCount))throw new Error("FOTMOB_ACCEPTANCE_GAP_REGRESSION");
          const cats=x=>Object.values(x.summary?.categoryComplete||{}).reduce((a,v)=>a+Number(v||0),0);
          if(cats(p)<cats(before))throw new Error("FOTMOB_ACCEPTANCE_CATEGORY_REGRESSION");
          if(cats(p)===cats(before)&&(p.summary?.fullyValidatedFixtures||0)===(before.summary?.fullyValidatedFixtures||0))throw new Error("FOTMOB_ACCEPTANCE_NO_COVERAGE_GAIN");
          console.log(JSON.stringify({accepted:true,summary:p.summary,gaps:g.count},null,2));
          NODE
