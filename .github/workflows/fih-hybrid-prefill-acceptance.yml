name: FIH Hybrid Prefill Acceptance

"on":
  pull_request:
    branches: [main]
    paths:
      - "scripts/hybrid-research-prefill.ts"
      - "scripts/sofascore-prefill-augment.ts"
      - "scripts/research-prefill-import.ts"
      - "scripts/step12-command-runner.mjs"
      - ".github/workflows/fih-hybrid-prefill-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Run Step 1-2 architecture tests
        run: npm run step12:test
      - name: Resolve current SAST date
        run: |
          echo "FIH_DATE=$(TZ=Africa/Johannesburg date +%F)" >> "$GITHUB_ENV"
      - name: Probe FotMob public JSON from GitHub runner
        run: |
          node --input-type=module <<'NODE'
          const d=process.env.FIH_DATE.replaceAll("-","");
          const u="https://www.fotmob.com/api/data/matches?date="+d;
          const r=await fetch(u,{headers:{"accept":"application/json","user-agent":"Mozilla/5.0"}});
          if(!r.ok)throw new Error("FOTMOB_PROBE_HTTP_"+r.status);
          const j=await r.json();
          const all=(j.leagues||[]).flatMap(l=>(l.matches||[]).map(m=>({...m,__league:l})));
          if(all.length<1)throw new Error("FOTMOB_PROBE_EMPTY");
          const sample=all.find(m=>m.home?.id&&m.away?.id&&m.leagueId)||all[0];
          const headers={"accept":"application/json","user-agent":"Mozilla/5.0"};
          const teamRes=await fetch("https://www.fotmob.com/api/data/teams?id="+sample.home.id,{headers});
          if(!teamRes.ok)throw new Error("FOTMOB_TEAM_PROBE_HTTP_"+teamRes.status);
          const team=await teamRes.json();
          const detailRes=await fetch("https://www.fotmob.com/api/data/matchDetails?matchId="+sample.id,{headers});
          if(!detailRes.ok)throw new Error("FOTMOB_DETAIL_PROBE_HTTP_"+detailRes.status);
          const detail=await detailRes.json();
          const tableRes=await fetch("https://www.fotmob.com/api/data/tltable?leagueId="+sample.leagueId,{headers});
          const table=tableRes.ok?await tableRes.json():null;
          const arrays=o=>Object.fromEntries(Object.entries(o||{}).filter(([,v])=>Array.isArray(v)).map(([k,v])=>[k,v.length]));
          console.log(JSON.stringify({
            fotmobProbe:true,status:r.status,matches:all.length,
            sample:{id:sample.id,leagueId:sample.leagueId,home:sample.home?.name,away:sample.away?.name},
            teamKeys:Object.keys(team||{}),teamFixtureKeys:Object.keys(team?.fixtures||{}),teamFixtureArrays:arrays(team?.fixtures),
            teamOverviewKeys:Object.keys(team?.overview||{}),teamFormSample:team?.overview?.teamForm?.[0]||null,
            h2hKeys:Object.keys(detail?.content?.h2h||{}),h2h:detail?.content?.h2h||null,
            tableIsArray:Array.isArray(table),tableSample:Array.isArray(table)?table[0]:table
          },null,2));
          NODE
      - name: Run deterministic prediction prefill sample
        run: npx tsx scripts/hybrid-research-prefill.ts --date "$FIH_DATE"
      - name: Snapshot ESPN baseline
        run: cp "data/research-prefill/$FIH_DATE.json" /tmp/fih-prefill-before-sofa.json
      - name: Augment deterministic prefill with SofaScore
        run: npx tsx scripts/sofascore-prefill-augment.ts --date "$FIH_DATE"
      - name: Verify prefill and gap artifacts
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const d=process.env.FIH_DATE;
          const p=JSON.parse(fs.readFileSync("data/research-prefill/"+d+".json","utf8"));
          const g=JSON.parse(fs.readFileSync("data/research-gap-queue/"+d+".json","utf8"));
          const before=JSON.parse(fs.readFileSync("/tmp/fih-prefill-before-sofa.json","utf8"));
          if(p.schema!=="fih-hybrid-research-prefill-v1"||g.schema!=="fih-chatgpt-gap-queue-v1"||p.researchRunId!==g.researchRunId||p.fixtureCount<1)throw new Error("HYBRID_ACCEPTANCE_IDENTITY_INVALID");
          if((p.summary?.matched||0)<1)throw new Error("HYBRID_ACCEPTANCE_NO_MATCHED_FIXTURES");
          if((p.summary?.sofascore?.matched||0)<1)throw new Error("SOFASCORE_ACCEPTANCE_NO_MATCHED_FIXTURES");
          if((p.summary?.fullyValidatedFixtures||0)<(before.summary?.fullyValidatedFixtures||0))throw new Error("SOFASCORE_ACCEPTANCE_VALIDATED_REGRESSION");
          if(g.count>(before.summary?.gapFixtures??before.fixtureCount))throw new Error("SOFASCORE_ACCEPTANCE_GAP_REGRESSION");
          const cats=x=>Object.values(x.summary?.categoryComplete||{}).reduce((a,v)=>a+Number(v||0),0);
          if(cats(p)<cats(before))throw new Error("SOFASCORE_ACCEPTANCE_CATEGORY_REGRESSION");
          console.log(JSON.stringify({accepted:true,summary:p.summary,gaps:g.count},null,2));
          NODE
