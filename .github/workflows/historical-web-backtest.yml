name: Historical Web Backtest
# manual-trigger-marker: 2026-10-05

on:
  push:
    branches: [main]
    paths:
      - "scripts/web-historical-backtest.ts"
      - "scripts/analyze-v25-candidate.ts"
      - "scripts/analyze-v26-calibration.ts"
      - "scripts/analyze-v27-quality.ts"
      - "scripts/analyze-v28-loss-patterns.ts"
      - "scripts/analyze-v28-candidate.ts"
      - "scripts/analyze-v29-losses.ts"
      - "scripts/analyze-v29-candidate.ts"
      - "lib/model.ts"
      - ".github/workflows/historical-web-backtest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-web-backtest-main
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx scripts/web-historical-backtest.ts
      - name: Analyze v2.5 candidate
        run: npx tsx scripts/analyze-v25-candidate.ts
      - name: Analyze v2.6 calibration
        run: npx tsx scripts/analyze-v26-calibration.ts
      - name: Analyze v2.7 quality
        run: npx tsx scripts/analyze-v27-quality.ts
      - name: Analyze v2.8 loss patterns
        run: npx tsx scripts/analyze-v28-loss-patterns.ts
      - name: Analyze v2.8 candidate
        run: npx tsx scripts/analyze-v28-candidate.ts
      - name: Analyze v2.9 losses
        run: npx tsx scripts/analyze-v29-losses.ts
      - name: Analyze v2.9 candidate
        run: npx tsx scripts/analyze-v29-candidate.ts
      - name: Commit canonical backtest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/backtests/2026-04-08_to_2026-10-04.json /tmp/fih-180-backtest.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/fih-180-backtest.json data/backtests/2026-04-08_to_2026-10-04.json
          git add data/backtests/2026-04-08_to_2026-10-04.json
          if git diff --cached --quiet; then
            echo "No backtest changes to commit"
          else
            git commit -m "Run 180-day web-reconstructed v2.4 backtest"
            git push
          fi
      - name: Regression tests
        continue-on-error: true
        run: npm test
