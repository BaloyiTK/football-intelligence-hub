name: Historical Web Backtest

on:
  push:
    branches: [main]
    paths:
      - "scripts/web-historical-backtest.ts"
      - ".github/workflows/historical-web-backtest.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx tsx scripts/web-historical-backtest.ts
      - name: Commit canonical backtest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtests/2026-04-08_to_2026-10-04.json
          if git diff --cached --quiet; then
            echo "No backtest changes to commit"
          else
            git commit -m "Run 180-day web-reconstructed v2.4 backtest"
            git push
          fi
      - name: Regression tests
        continue-on-error: true
        run: npm test
