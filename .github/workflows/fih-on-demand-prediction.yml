name: FIH On-Demand Prediction

"on":
  workflow_dispatch:
    inputs:
      date:
        description: "Prediction date (YYYY-MM-DD, today or future in Africa/Johannesburg)"
        required: true
        type: string
  repository_dispatch:
    types: [fih_prediction]

permissions:
  contents: write

concurrency:
  group: fih-prediction-${{ inputs.date || github.event.client_payload.date }}
  cancel-in-progress: false

jobs:
  prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate prediction date and fixture board
        env:
          FIH_DATE: ${{ inputs.date || github.event.client_payload.date }}
        run: |
          set -euo pipefail
          TODAY="$(TZ=Africa/Johannesburg date +%F)"
          [[ "$FIH_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "INVALID_FIH_DATE"; exit 1; }
          [[ "$FIH_DATE" < "$TODAY" ]] && { echo "DATE_MODE_MISMATCH: historical dates require BACKTEST"; exit 1; }
          node - <<'NODE'
          const fs=require("fs");
          const d=process.env.FIH_DATE;
          const p=`data/prediction-fixtures/${d}.json`;
          if(!fs.existsSync(p)) throw new Error("MISSING_PREDICTION_FIXTURE_BOARD "+p);
          const x=JSON.parse(fs.readFileSync(p,"utf8"));
          if(x.schema!=="fih-prediction-fixture-v1"||x.mode!=="PREDICTION"||x.date!==d||x.timezone!=="Africa/Johannesburg") throw new Error("PREDICTION_BOARD_IDENTITY_INVALID");
          const n=(x.payload?.Stages||[]).reduce((a,s)=>a+(Array.isArray(s.Events)?s.Events.length:0),0);
          if(!n||n!==x.fixtureCount) throw new Error("PREDICTION_BOARD_COUNT_INVALID");
          console.log(JSON.stringify({gate:"PASS",date:d,fixtureCount:n,fetchedAt:x.fetchedAt}));
          NODE

      - name: Install executor
        run: npm install --no-audit --no-fund

      - name: Execute full dated prediction cycle
        env:
          FIH_DATE: ${{ inputs.date || github.event.client_payload.date }}
        run: npm run run:daily -- --date "$FIH_DATE"

      - name: Persist canonical prediction artifacts
        env:
          FIH_DATE: ${{ inputs.date || github.event.client_payload.date }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "data/run-state/$FIH_DATE.json" "data/research/$FIH_DATE" "data/model/$FIH_DATE" "data/decisions/$FIH_DATE" "data/predictions/$FIH_DATE.json" || true
          if ! git diff --cached --quiet; then
            git commit -m "ops: complete FIH prediction $FIH_DATE"
            for attempt in 1 2 3; do
              if git push; then break; fi
              git fetch origin main
              git rebase origin/main || { git rebase --abort || true; exit 1; }
              sleep $((attempt * 2))
              [[ "$attempt" -eq 3 ]] && exit 1
            done
          fi
          git fetch origin main
          LOCAL="$(git rev-parse HEAD)"
          REMOTE="$(git rev-parse origin/main)"
          [[ "$LOCAL" = "$REMOTE" ]] || { echo "COMMIT_VERIFY_FAILED local=$LOCAL remote=$REMOTE"; exit 1; }
          echo "FIH_COMMIT_SHA=$REMOTE" >> "$GITHUB_ENV"

      - name: Verify terminal contract
        env:
          FIH_DATE: ${{ inputs.date || github.event.client_payload.date }}
        run: |
          npm run contract:gate -- --verdict COMPLETE --terminal --date "$FIH_DATE" --rules TERM-002,EVID-001,RESP-001 --evidence aggregate-verified,canonical-artifacts-verified,commit-verified,"commit:$FIH_COMMIT_SHA"

      - name: Report completion
        env:
          FIH_DATE: ${{ inputs.date || github.event.client_payload.date }}
        run: echo "DAILY_CYCLE_COMPLETE $FIH_DATE $FIH_COMMIT_SHA"
