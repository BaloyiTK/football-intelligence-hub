name: FIH Execution Bridge

on:
  push:
    branches: [main]
    paths:
      - "automation/commands/*.json"
  workflow_dispatch:
    inputs:
      command_file:
        description: "Path to an FIH command JSON"
        required: true
        type: string

concurrency:
  group: fih-execution-bridge
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with bounded retry
        shell: bash
        run: |
          set -euo pipefail
          delays=(0 15 45)
          for attempt in 1 2 3; do
            (( delays[attempt-1] > 0 )) && sleep "${delays[attempt-1]}"
            npm install --no-audit --no-fund && exit 0
            echo "::warning::dependency install attempt $attempt/3 failed"
          done
          exit 1

      - name: Resolve command
        id: command
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            FILE="${{ inputs.command_file }}"
          else
            FILE="$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'automation/commands/*.json' | tail -1)"
          fi
          [[ -n "$FILE" && -f "$FILE" ]] || { echo "::error::No command file found"; exit 1; }
          # Safe self-repair: normalize known aliases and recover a single unambiguous dated run.
          node <<'NODE' "$FILE"
          const fs=require("fs"), path=require("path");
          const p=process.argv[2];
          const x=JSON.parse(fs.readFileSync(p,"utf8"));
          if (!x.action && typeof x.command==="string") {
            x.action=x.command;
            console.log("::notice::self-repair: normalized command -> action");
          }
          if (!["validate","finalize","verify-publication"].includes(x.action)) throw new Error("Unsupported action after safe normalization");
          if (x.date!=null && !/^[0-9]{4}-[0-9]{2}-[0-9]{2}$/.test(x.date)) throw new Error("Invalid date");
          const validRun=v=>typeof v==="string"&&v.startsWith("data/runs/")&&!v.includes("..")&&fs.existsSync(v);
          if (!validRun(x.runFile)) {
            if (!x.date) throw new Error("Invalid runFile and no date available for recovery");
            const dir="data/runs";
            const matches=fs.readdirSync(dir).filter(n=>n.startsWith(x.date+"_")&&n.endsWith(".json")).map(n=>path.join(dir,n));
            if (matches.length!==1) throw new Error("Cannot safely recover runFile: expected exactly 1 dated run, found "+matches.length);
            x.runFile=matches[0];
            console.log("::notice::self-repair: recovered runFile="+x.runFile);
          }
          fs.writeFileSync(p,JSON.stringify(x,null,2)+"\n");
          NODE
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          echo "action=$(node -p 'require("./"+process.argv[1]).action' "$FILE")" >> "$GITHUB_OUTPUT"
          echo "run_file=$(node -p 'require("./"+process.argv[1]).runFile' "$FILE")" >> "$GITHUB_OUTPUT"
          echo "date=$(node -p 'require("./"+process.argv[1]).date||""' "$FILE")" >> "$GITHUB_OUTPUT"

      - name: Contract and model checks
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run model:preflight
          node -e 'const c=require("./automation/FIH_CONTRACT.json"); if(!c.recoveryPolicy?.enabled) throw new Error("FIH recovery policy is not enabled"); if(c.recoveryPolicy.businessRuleMutationForbidden!==true||c.recoveryPolicy.evidenceFabricationForbidden!==true) throw new Error("Unsafe recovery policy");'

      - name: Validate run with bounded self-recovery
        shell: bash
        run: |
          set -uo pipefail
          RUN="${{ steps.command.outputs.run_file }}"
          for attempt in 1 2 3; do
            if npm run run:validate -- "$RUN"; then exit 0; fi
            echo "::warning::validation failed; autonomous repair cycle $attempt/3"
            # Deterministic repairs only. Never alter model rules/evidence/results.
            node -e 'const fs=require("fs"); const p=process.argv[1]; const r=JSON.parse(fs.readFileSync(p,"utf8")); let changed=false; if(r.status==="complete" && Array.isArray(r.leagueScan) && r.leagueScan.some(x=>x.status!=="complete")){r.status="processing"; changed=true;} if(changed) fs.writeFileSync(p,JSON.stringify(r,null,2)+"\\n");' "$RUN"
            sleep $((attempt*5))
          done
          echo "::error::validation recovery budget exhausted"
          exit 2

      - name: Strict finalize
        if: steps.command.outputs.action == 'finalize' || steps.command.outputs.action == 'verify-publication'
        run: npm run run:finalize -- "${{ steps.command.outputs.run_file }}"

      - name: Create and verify publication
        if: steps.command.outputs.action == 'verify-publication'
        run: |
          [[ -n "${{ steps.command.outputs.date }}" ]] || { echo "::error::date required"; exit 1; }
          npm run predictions:publish-from-run -- "${{ steps.command.outputs.run_file }}"
          npm run predictions:verify -- "${{ steps.command.outputs.date }}"

      - name: Build production app
        if: steps.command.outputs.action == 'verify-publication'
        run: npm run build

      - name: Commit and push publication
        if: steps.command.outputs.action == 'verify-publication'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          FILE="data/predictions/${{ steps.command.outputs.date }}.json"
          git add "$FILE"
          git diff --cached --quiet && exit 0
          git commit -m "predictions: publish ${{ steps.command.outputs.date }}"
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
            sleep $((attempt*15))
          done
          exit 1
