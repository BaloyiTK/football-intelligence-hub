name: FIH Reliability CI
"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/daily-run-ledger.ts"
      - "scripts/daily-reliability-watchdog.ts"
      - ".github/workflows/fih-daily-reliability-watchdog.yml"
      - ".github/workflows/fih-daily-data-ingest.yml"
      - "config/fih-execution-rules.json"
      - "scripts/contract-gate.ts"
      - "scripts/research-canonical.ts"
      - "scripts/daily-cycle.ts"
      - "scripts/research-worker.ts"
      - "scripts/daily-model-runner.ts"
      - "scripts/fih-probability-v2.ts"
      - "scripts/step3-input-gate.ts"
      - "scripts/step3-normalize.ts"
      - "scripts/verify-step3-wiring.ts"
      - "scripts/verify-research-storage-lock.ts"
      - "scripts/verify-research-actual-capture.ts"
      - ".github/workflows/fih-run-now.yml"
      - "package.json"
      - "scripts/daily-decision-runner.ts"
      - "scripts/step12-prepare.ts"
      - "scripts/step12-command-runner.mjs"
      - "scripts/step2-autonomous-runner.ts"
      - "scripts/test-step12-implementation.mjs"
      - "api/_fih-auth.js"
      - "api/research-fixture.js"
      - ".github/workflows/fih-step12-command.yml"
      - ".github/workflows/fih-reliability-ci.yml"
permissions:
  contents: read
jobs:
  failure-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify runner Node
        run: node --version && npm --version
      - run: npm install --no-audit --no-fund
      - name: Verify Step 1-2 implementation compiles
        run: npm run step12:test
      - name: Verify Step 2 storage lock
        run: npm run research:storage-lock
      - name: Verify Step 2 actual-capture lock
        run: npm run research:actual-capture-lock
      - name: Verify Step 3 wiring lock
        run: npm run step3:wiring-lock
      - name: Build isolated fixture board
        run: |
          ROOT="$(mktemp -d)"; echo "FIH_ROOT=$ROOT" >> "$GITHUB_ENV"; mkdir -p "$ROOT/data/run-state" "$ROOT/data/prediction-fixtures"
          node - "$ROOT" <<'NODE'
          const fs=require("fs"),p=require("path"),root=process.argv[2],date="2099-01-01";
          const x={schema:"fih-today-fixture-v1",date,timezone:"Africa/Johannesburg",fetchedAt:new Date().toISOString(),stageCount:1,fixtureCount:1,payload:{Stages:[{CompId:"1",CompN:"Liga 2",Snm:"Liga 2",Cnm:"Test",Events:[{Eid:"fx1",Eps:"NS",Esd:"20990101120000",T1:[{Nm:"Alpha"}],T2:[{Nm:"Beta"}]}]}]}};
          fs.writeFileSync(p.join(root,"data","prediction-fixtures",date+".json"),JSON.stringify({...x,schema:"fih-prediction-fixture-v1"}));
          NODE
      - name: Init and verify reliability metadata
        run: |
          npm run run:ledger:init -- --date 2099-01-01
          npm run run:ledger:verify -- --date 2099-01-01
          node -e 'const x=require(process.env.FIH_ROOT+"/data/run-state/2099-01-01.json");if(!x.fixtures[0].eligible||x.runId!=="daily:2099-01-01"||!x.heartbeatAt||x.runStatus!=="RUNNING")process.exit(1)'
      - name: Fresh heartbeat must be active
        run: npm run reliability:watchdog -- --date 2099-01-01
      - name: Stale heartbeat must request recovery
        run: |
          node -e 'const fs=require("fs"),p=process.env.FIH_ROOT+"/data/run-state/2099-01-01.json",x=require(p);x.heartbeatAt="2000-01-01T00:00:00.000Z";x.runStatus="RECOVERING";fs.writeFileSync(p,JSON.stringify(x))'
          set +e; npm run reliability:watchdog -- --date 2099-01-01; code=$?; set -e; test "$code" -eq 10
      - name: Missing research artifact must block advancement
        run: |
          if npm run run:ledger -- advance --date 2099-01-01 --fixture fx1 --to RESEARCH_VERIFIED; then echo "guard failed"; exit 1; fi
      - name: Canonical artifacts permit monotonic lifecycle
        run: |
          mkdir -p "$FIH_ROOT/data/research" "$FIH_ROOT/data/model" "$FIH_ROOT/data/decisions" "$FIH_ROOT/data/predictions"
          node - "$FIH_ROOT" <<'NODE'
          const fs=require("fs"),p=require("path"),root=process.argv[2],cats=["overallForm","venueForm","leaguePosition","teamQuality","motivationContext","h2h","goalsProfile","squadAvailability","opponentStrength","restSchedule"],e={};for(const k of cats)e[k]={status:"UNAVAILABLE",attempts:[{query:"Alpha Beta "+k,attemptedAt:new Date().toISOString(),outcome:"NO_VERIFIABLE_EVIDENCE"}]};const x={schema:"fih-daily-research-v2",date:"2099-01-01",mode:"PREDICTION",fixtureCount:1,fixtures:[{fixtureId:"fx1",fixture:{home:"Alpha",away:"Beta"},researchedAt:new Date().toISOString(),sourceMetadata:[],evidence:e,verifiedInputs:{overallMatchSeries:{home:[],away:[]}}}]};fs.writeFileSync(p.join(root,"data/research/2099-01-01.json"),JSON.stringify(x));
          NODE
          npm run run:ledger -- advance --date 2099-01-01 --fixture fx1 --to RESEARCH_VERIFIED
          if npm run run:ledger -- advance --date 2099-01-01 --fixture fx1 --to DECISION_VERIFIED; then echo "skip guard failed"; exit 1; fi
          echo '{"schema":"fih-daily-model-v2","date":"2099-01-01","fixtureCount":1,"fixtures":[{"fixtureId":"fx1","status":"INSUFFICIENT_DATA"}]}' > "$FIH_ROOT/data/model/2099-01-01.json"
          npm run run:ledger -- advance --date 2099-01-01 --fixture fx1 --to MODEL_VERIFIED
          echo '{"schema":"fih-daily-decisions-v2","date":"2099-01-01","fixtureCount":1,"fixtures":[{"fixtureId":"fx1","decision":"NO_MODEL","publishable":false}]}' > "$FIH_ROOT/data/decisions/2099-01-01.json"
          npm run run:ledger -- advance --date 2099-01-01 --fixture fx1 --to DECISION_VERIFIED
          npm run run:ledger -- advance --date 2099-01-01 --fixture fx1 --to COMPLETE
          echo '{"schema":"fih-daily-predictions-v1","date":"2099-01-01","eligibleFixtures":1,"publishableCount":0,"predictions":[]}' > "$FIH_ROOT/data/predictions/2099-01-01.json"
      - name: Contract gate must accept reconciled synthetic cycle
        run: |
          set +e
          FIH_ROOT="$FIH_ROOT" npm run contract:gate -- --verdict COMPLETE --date 2099-01-01 --rules TERM-002,EVID-001 --evidence synthetic-ci
          code=$?
          set -e
          test "$code" -ne 0
          echo "PASS: COMPLETE gate refuses uncommitted synthetic artifacts"
